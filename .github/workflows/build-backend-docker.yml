name: Backend Docker Build & Push
# 触发规则：main分支 + 你的新版new-grade-rule分支推送时运行
on:
  push:
    branches:
      - main
      - new-grade-rule

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取当前分支全部代码（包含你修改后的GradeServiceImpl.java）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录Docker Hub，需要提前配置仓库密钥
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. 根据分支设置镜像标签
      - name: Set image tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/heads/new-grade-rule ]]; then
            echo "TAG=newrule" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      # 4. 构建镜像并推送至Docker Hub
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: eloisat/234-backend:${{ env.TAG }}